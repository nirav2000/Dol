name: Factor Frenzy tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify scripts
        run: |
          node --check logic.mjs
          node --check adaptive.mjs
          node --check learning-app.mjs
      - name: Unit tests
        run: node --test tests/*.test.mjs
