name: Factor Frenzy tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dol-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify release consistency
        run: node scripts/release-version.mjs --check
      - name: Verify scripts
        run: |
          node --check logic.mjs
          node --check adaptive.mjs
          node --check learning-app.mjs
          node --check learning-insights.mjs
          node --check challenge-controls.mjs
          node --check difficulty-profile.mjs
          node --check dol-account.mjs
          node --check strategy-model.mjs
          node --check strategy-coach.mjs
          node --check board-aware-help.mjs
          node --check teaching-model.mjs
          node --check teaching-question.mjs
          node --check teaching-coach.mjs
          node --check square-workshop.mjs
          node --check square-learning-model.mjs
          node --check square-learning-studio.mjs
          node --check square-fluency.mjs
          node --check round-tools.mjs
          node --check round-model.mjs
          node --check visual-tools.mjs
          node --check mobile-entry.mjs
          node --check device-profile.mjs
          node --check diagnostics.mjs
          node --check layout-options.mjs
          node --check factor-patterns.mjs
          node --check improvement/model.mjs
          node --check improvement/store.mjs
          node --check improvement/check.mjs
          node --check improvement/clock.mjs
          node --check improvement/index.mjs
          node --check improvement/ui.mjs
          node --check learning-app.mjs
          node --check tablet-keypad.mjs
      - name: Unit tests
        run: node --test tests/*.test.mjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - uses: actions/checkout@v5
        with:
          repository: nirav2000/Apps
          path: Apps-shared
      - name: Shared static app validation
        run: node Apps-shared/validation/validate-static-app.mjs . validation.config.json
      - name: Browser smoke tests
        run: |
          python3 -m http.server 8000 > /tmp/dol-server.log 2>&1 &
          sleep 2
          node tests/browser-smoke.mjs
          node tests/improvement-browser.mjs
          node tests/strategy-browser.mjs
          node tests/teaching-browser.mjs
          node tests/square-studio-browser.mjs
          node tests/round-tools-browser.mjs
          node tests/mobile-entry-browser.mjs
          APPS_CHECKOUT=Apps-shared node tests/mobile-tutor-browser.mjs
          APPS_CHECKOUT=Apps-shared node tests/learning-first-browser.mjs
          APPS_CHECKOUT=Apps-shared node tests/startup-recovery-browser.mjs
          node tests/mobile-dock-browser.mjs
          APPS_CHECKOUT=Apps-shared node tests/diagnostics-ui-browser.mjs
          if grep -q 'diagnostic-recipe:tablet-factor-visibility-v1' ui/pairboard-tablet.css; then APPS_CHECKOUT=Apps-shared node tests/diagnostic-25-browser.mjs; fi
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: factor-frenzy-browser
          path: |
            browser-desktop.png
            browser-mobile.png
            artifacts/*.png
          if-no-files-found: ignore

  deploy:
    name: Publish only tested revision
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: dol-pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Confirm exact tested commit and version
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          node scripts/release-version.mjs --check
      - name: Stage immutable Pages artifact
        run: |
          mkdir -p _pages
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='node_modules/' --exclude='Apps-shared/' --exclude='artifacts/' --exclude='_pages/' --exclude='tests/' --exclude='scripts/' --exclude='version-lab-data/' --exclude='_release-candidate/' --exclude='.firebase-test/' --exclude='browser-desktop.png' --exclude='browser-mobile.png' ./ _pages/
          test -s _pages/index.html
          test -s _pages/version.json
          test -s _pages/learning-app.mjs
          test -s _pages/challenge-controls.mjs
          test -s _pages/mobile-redesign.css
          test -s _pages/improvement/ui.mjs
          test -s _pages/teaching-coach.mjs
          test -s _pages/square-workshop.mjs
          test -s _pages/square-learning-studio.mjs
          test -s _pages/square-fluency.mjs
          test -s _pages/square-fluency.css
          test -s _pages/square-learning-studio.css
          touch _pages/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _pages
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
