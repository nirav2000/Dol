name: Factor Frenzy tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify scripts
        run: |
          node --check logic.mjs
          node --check adaptive.mjs
          node --check learning-app.mjs
          node --check strategy-model.mjs
          node --check strategy-coach.mjs
          node --check round-tools.mjs
          node --check round-model.mjs
          node --check visual-tools.mjs
          node --check mobile-entry.mjs
          node --check device-profile.mjs
          node --check diagnostics.mjs
          node --check layout-options.mjs
          node --check tablet-keypad.mjs
      - name: Unit tests
        run: node --test tests/*.test.mjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - uses: actions/checkout@v4
        with:
          repository: nirav2000/Apps
          path: Apps-shared
      - name: Browser smoke tests
        run: |
          python3 -m http.server 8000 > /tmp/dol-server.log 2>&1 &
          sleep 2
          node tests/browser-smoke.mjs
          node tests/strategy-browser.mjs
          node tests/round-tools-browser.mjs
          node tests/mobile-entry-browser.mjs
          node tests/mobile-dock-browser.mjs
          APPS_CHECKOUT=Apps-shared node tests/diagnostics-ui-browser.mjs
      - name: Verify published Dol v2.6.0 and Shared Diagnostics assets
        run: |
          set -e
          for path in / /device-profile.mjs /diagnostics.mjs /ui/pairboard-phone.css /ui/pairboard-tablet.css /ui/pairboard-desktop.css /version.json; do
            curl --fail --location --retry 10 --retry-delay 3 --retry-all-errors --silent --show-error "https://nirav2000.github.io/Dol$path" -o /tmp/dol-live
            test -s /tmp/dol-live
            if [ "$path" = / ]; then grep -q 'v2.6.0' /tmp/dol-live; fi
            if [ "$path" = /version.json ]; then grep -q '"2.6.0"' /tmp/dol-live; fi
          done
          curl --fail --location --retry 10 --retry-delay 3 --retry-all-errors --silent --show-error https://nirav2000.github.io/Apps/diagnostics/releases/1.0.0/index.mjs -o /tmp/shared-live
          grep -q 'initialise' /tmp/shared-live
          echo 'Published Dol and Apps diagnostics assets verified.'
      - name: Test real deployed phone and tablet interfaces
        run: node tests/live-diagnostics-browser.mjs
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factor-frenzy-browser
          path: |
            browser-desktop.png
            browser-mobile.png
            artifacts/*.png
          if-no-files-found: ignore
