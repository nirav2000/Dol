name: Audit original site
on:
  push:
    paths:
      - '.github/workflows/site-audit.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch raw HTML and embedded references
        run: |
          python3 - <<'PY'
          import urllib.request,re,html,json
          for url in ["https://www.mistakes.cool/","https://www.mistakes.cool/home"]:
            print("\n========== SOURCE",url,"==========")
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=30) as r: body=r.read().decode("utf-8","replace")
              open("original-page.html","w").write(body)
              print("HTML SIZE:",len(body))
              for rx in [r'<iframe[^>]+>',r'https?[^"\\\\ ]{15,300}',r'Embedded Files.{0,500}',r'mistakes[^"\\\\ ]{0,300}']:
                arr=re.findall(rx,body,re.I)
                print("PATTERN",rx,"COUNT",len(arr),"SAMPLES",list(dict.fromkeys(arr))[:30])
              print("BODY START",body[:7000])
            except Exception as e: print(type(e).__name__,str(e))
          PY
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Inspect rendered page and frames
        run: |
          node <<'JS'
          const {chromium} = require('playwright');
          (async () => {
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror', e=>errors.push(String(e)));
            page.on('console', msg=>{if(msg.type()==='error')errors.push(msg.text())});
            await page.goto('https://www.mistakes.cool/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(12000);
            await page.screenshot({path:'reference.png',fullPage:true});
            const frames=page.frames();
            console.log('PAGES',page.url(), 'FRAMECOUNT',frames.length);
            for(let i=0;i<frames.length;i++) {
              const f=frames[i]; 
              console.log('FRAME',i,'URL',f.url());
              try{
                const obj=await f.evaluate(()=>{
                  const els=Array.from(document.querySelectorAll('button,input,select,textarea,a,[role="button"],[onclick],[tabindex]')).slice(0,160).map(e=>({tag:e.tagName,txt:(e.innerText||e.value||e.ariaLabel||'').slice(0,150),href:e.getAttribute('href'),type:e.getAttribute('type'),role:e.getAttribute('role')}));
                  return {title:document.title, text:document.body.innerText.slice(0,30000),html:document.body.outerHTML.slice(0,7000),controls:els,iframe: Array.from(document.querySelectorAll('iframe')).map(e=>e.outerHTML.slice(0,1000))};
                });
                console.log('FRAME_CONTENT',i,JSON.stringify(obj).slice(0,50000));
              }catch(e){console.log('FRAME_ERR',i,String(e));}
            }
            console.log('PAGE_ERRORS',JSON.stringify(errors.slice(0,15)));
            await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-site-audit
          path: |
            original-page.html
            reference.png
