name: Version Lab checkpoint
on:
  push:
    branches: [main]
    paths: ['version.json', '.github/workflows/version-lab.yml']
  workflow_dispatch:
    inputs:
      title:
        description: Checkpoint title
        required: true
        type: string
      summary:
        description: Concise summary
        required: true
        type: string
      areas:
        description: Change areas
        required: false
        type: string
      product_version:
        description: Product version
        required: false
        type: string
jobs:
  version-lab:
    uses: nirav2000/Apps/.github/workflows/version-lab-release.yml@main
    with:
      title: ${{ inputs.title || 'Factor Frenzy learning edition v2.0.3' }}
      summary: ${{ inputs.summary || 'Black and grey redesign, three learning modes, adaptive question selection, guided hints, strategy guide, learning SDK and progress tracking.' }}
      areas: ${{ inputs.areas || 'Learning modes::feature::Guided, independent and timed|Scaffolding::feature::Progressive factor hints|Design::redesign::Monochrome responsive interface|Progress::feature::Shared Learning SDK' }}
      product_version: ${{ inputs.product_version || '2.0.3' }}
    permissions:
      contents: write
