<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dol teaching regression harness</title><link rel="stylesheet" href="../teaching.css"><style>body{font:17px system-ui;background:#080808;color:#eee;margin:24px}button,input,select{font:inherit}button{cursor:pointer;padding:10px 16px;border:1px solid #777;border-radius:22px;color:inherit;background:#222}.primary{background:#f5f5f5;color:#111;font-weight:700}.text-button{border:0;text-decoration:underline;background:none}.muted{color:#b8b8b8}.small{font-size:14px}.eyebrow{letter-spacing:.16em;font-size:12px;font-weight:bold}.coach-header{display:flex;justify-content:space-between;gap:12px}.coach-header h2{margin-top:0}.coach-factor-picker{display:flex;flex-wrap:wrap;gap:10px}main{max-width:1000px;margin:auto}[hidden]{display:none!important}</style><body><main><section id="playView"><h1>595</h1><p>Your board: 1 x 595 | 5 x 119 | 7 x 85</p><button id="helpToggle">Hint</button></section><section id="learnView"><div class="page-head"><h1>Learn the methods.</h1></div></section><section id="progressView"></section></main><script type="module">
import {createTeachingCoach} from '../teaching-coach.mjs';
window.events=[];window.pauses=0;window.holds=0;window.focusReturns=0;
window.state={target:595,round:33,score:218,mistakes:0,found:new Set(['1-595','5-119','7-85']),phase:'running',view:'play',mode:'practice'};
window.tutor=createTeachingCoach({getState:()=>window.state,pause:()=>{window.pauses++;window.state.phase=window.state.phase==='running'?'paused':'running';},focusAnswer:()=>window.focusReturns++,holdTime:()=>window.holds++,releaseTime:()=>window.holds--,learning:{record:e=>window.events.push(e)}});
document.getElementById('helpToggle').onclick=window.tutor.open;
window.ready=true;
</script></body></html>
