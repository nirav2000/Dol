<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Version Lab · Developer access</title><style>body{margin:0;background:#080808;color:#fff;font:16px system-ui;display:grid;min-height:100vh;place-items:center}.card{background:#202020;border:1px solid #444;border-radius:18px;padding:24px;max-width:520px}button{background:white;color:black;padding:12px 20px;border:0;border-radius:20px;font:inherit;font-weight:700}</style></head><body><main class="card"><p>DEVELOPER TOOL</p><h1>Version Lab</h1><p>This area is separate from the app and requires the shared App Monitor administrator passkey.</p><button id="unlock">Unlock with passkey</button><p id="status" role="status"></p></main><script>window.VERSION_LAB_APP_ID="dol";</script><script src="https://nirav2000.github.io/Apps/version-lab/access.js"></script><script>const b=document.getElementById('unlock'),s=document.getElementById('status');(async()=>{try{if(await VersionLabAccess.validate()){b.textContent="Open Version Lab";s.textContent="Developer session verified."}}catch{}})();b.onclick=async()=>{b.disabled=true;s.textContent="Verifying…";try{await VersionLabAccess.unlockAndOpen(window.VERSION_LAB_APP_ID)}catch(e){s.textContent=e.message||String(e);b.disabled=false}};</script></body></html>
